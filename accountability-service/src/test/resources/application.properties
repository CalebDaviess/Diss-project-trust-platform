quarkus.http.test-port=0
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:accountability;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.rest-client.detection-engine.url=http://localhost:8000
quarkus.rest-client.detection-engine.connect-timeout=5000
quarkus.rest-client.detection-engine.read-timeout=5000
mp.jwt.verify.issuer=trust-platform
# Conduct-report transport uses the in-memory connector in tests (no Kafka broker / Docker).
mp.messaging.outgoing.conduct-reports-out.connector=smallrye-in-memory
mp.messaging.incoming.conduct-reports-in.connector=smallrye-in-memory
quarkus.kafka.devservices.enabled=false
