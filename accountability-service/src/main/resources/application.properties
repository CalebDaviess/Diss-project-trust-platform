quarkus.application.name=accountability-service
# Pin the dev/prod HTTP port so the player-portal default (VITE_API_BASE_URL=http://localhost:8081) works out of the box.
quarkus.http.port=8081
# CORS: allow the Vite dev server origin so the browser portal can call this API during local development.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,X-Profile-Id,Authorization
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.rest-client.detection-engine.url=${DETECTION_ENGINE_URL:http://localhost:8000}
quarkus.rest-client.detection-engine.connect-timeout=5000
quarkus.rest-client.detection-engine.read-timeout=5000

# ── JWT (Contract 0) ────────────────────────────────────────────────────────
# Issuer stamped into minted tokens and required when verifying them.
mp.jwt.verify.issuer=trust-platform
# RS256 keys. Dev keypair is committed under resources/jwt (DEV ONLY — prod injects
# real keys via these same properties, e.g. env-provided file paths or vault secrets).
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.publickey.location=jwt/publicKey.pem

# ── Interim identity fallback ───────────────────────────────────────────────
# Production is JWT-only: the X-Profile-Id header is ignored unless explicitly enabled.
# Enabled only in dev/test so the player-portal keeps working until its login is wired.
accountability.auth.allow-header-fallback=false
%dev.accountability.auth.allow-header-fallback=true
%test.accountability.auth.allow-header-fallback=true

# ── Demo login seed (dev/test only) ─────────────────────────────────────────
accountability.auth.seed-demo-user=false
%dev.accountability.auth.seed-demo-user=true
%test.accountability.auth.seed-demo-user=true

# ── Self-service account creation (dev/test only) ───────────────────────────
# Lets the player-portal's "Create account" flow mint a real player credential via POST /auth/register.
# Disabled in production, where real accounts are provisioned after identity verification
# (designed, not built) — the endpoint returns 403 when this flag is false.
accountability.auth.allow-self-register=false
%dev.accountability.auth.allow-self-register=true
%test.accountability.auth.allow-self-register=true

# ── Simulated anti-cheat vendor demo hook (dev/test only) ───────────────────
# Lets the player-portal trigger the in-module SimulatedAntiCheatVendor so the external-verdict →
# confirmed → audited → trust-drop flow is demonstrable without a real third-party vendor. The
# endpoint returns 404 in production (prod verdicts arrive at /anti-cheat-verdicts from a real vendor).
accountability.demo.allow-simulated-anti-cheat=false
%dev.accountability.demo.allow-simulated-anti-cheat=true
%test.accountability.demo.allow-simulated-anti-cheat=true

# ── Simulated appeal resolution (dev/test only) ─────────────────────────────
# Lets the portal "pretend the game studio reviewed an appeal" and approve/deny it. In production
# appeal outcomes come from real governance review, so POST /appeals/{id}/resolve returns 404.
accountability.demo.allow-appeal-resolution=false
%dev.accountability.demo.allow-appeal-resolution=true
%test.accountability.demo.allow-appeal-resolution=true

# ── Simulated operator ban (dev/test only) ──────────────────────────────────
# Lets the portal demo typed operator bans (communication/temporary/permanent, appealable or not).
accountability.demo.allow-simulated-ban=false
%dev.accountability.demo.allow-simulated-ban=true
%test.accountability.demo.allow-simulated-ban=true
# ── Conduct-report event transport (Kafka + CloudEvents) ────────────────────
# Flagged conduct samples are published as a CloudEvent (binary mode: attributes in Kafka headers)
# to the 'conduct-reports' topic; the in-module simulated operator consumes the same topic. In dev,
# Kafka Dev Services starts a broker automatically (needs Docker); in prod set KAFKA_BOOTSTRAP_SERVERS.
# NOTE: kafka.bootstrap.servers is set for prod ONLY. In dev/test it is deliberately left
# unset so Quarkus Kafka Dev Services auto-starts (and injects) a broker — Dev Services is
# skipped whenever this property already has a value.
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.outgoing.conduct-reports-out.connector=smallrye-kafka
mp.messaging.outgoing.conduct-reports-out.topic=conduct-reports
mp.messaging.outgoing.conduct-reports-out.cloud-events-mode=binary
mp.messaging.incoming.conduct-reports-in.connector=smallrye-kafka
mp.messaging.incoming.conduct-reports-in.topic=conduct-reports
mp.messaging.incoming.conduct-reports-in.auto.offset.reset=earliest
