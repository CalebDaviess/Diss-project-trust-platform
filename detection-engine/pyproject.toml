[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata + dependencies. This file is the Python equivalent of a
# Maven pom.xml — the single source of truth for the detection-engine build.
# ---------------------------------------------------------------------------
[project]
name = "detection-engine"
version = "0.1.0"
description = "Conduct-detection engine — toxic text/voice chat detection (POST /score)."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "joblib>=1.4",
]

# Development / testing extras:  pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",   # required by fastapi.testclient
]

# Application code uses a src-layout (packages discovered under src/).
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # joblib pickling numpy arrays trips a NumPy 2.5 deprecation — library noise, not ours.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # Starlette TestClient/httpx deprecation — test-framework noise, not ours.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
